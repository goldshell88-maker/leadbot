<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Лид-бот — тестовый клиент</title>
<style>
  :root { --bg:#0f1216; --panel:#171c22; --line:#262d36; --me:#2b6cb0; --bot:#232b34;
          --text:#e6eaef; --muted:#8b96a3; --ok:#2f9e6f; --warn:#c9932b; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 system-ui,Segoe UI,Arial; background:var(--bg); color:var(--text);
         display:grid; grid-template-columns:1fr 340px; height:100vh; }
  .col { display:flex; flex-direction:column; min-height:0; }
  header { padding:10px 14px; border-bottom:1px solid var(--line); display:flex; gap:10px; align-items:center; }
  header b { font-size:15px; } header .m { color:var(--muted); font-size:12px; }
  #chat { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:80%; padding:8px 12px; border-radius:12px; white-space:pre-wrap; word-wrap:break-word; }
  .me  { align-self:flex-end; background:var(--me); border-bottom-right-radius:3px; }
  .bot { align-self:flex-start; background:var(--bot); border-bottom-left-radius:3px; }
  .sys { align-self:center; color:var(--muted); font-size:12px; }
  form { display:flex; gap:8px; padding:12px; border-top:1px solid var(--line); }
  input[type=text] { flex:1; padding:10px 12px; border-radius:10px; border:1px solid var(--line);
                     background:var(--panel); color:var(--text); }
  button { padding:10px 14px; border:0; border-radius:10px; background:var(--me); color:#fff; cursor:pointer; }
  button.ghost { background:var(--panel); border:1px solid var(--line); color:var(--text); }
  aside { border-left:1px solid var(--line); background:var(--panel); padding:14px; overflow-y:auto; }
  aside h3 { margin:0 0 10px; font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  .fld { display:flex; justify-content:space-between; gap:10px; padding:7px 0; border-bottom:1px solid var(--line); }
  .fld .k { color:var(--muted); } .fld .v { text-align:right; }
  .fld.empty .v { color:var(--warn); }
  .badge { display:inline-block; padding:3px 9px; border-radius:20px; font-size:12px; }
  .badge.ok { background:rgba(47,158,111,.18); color:#7fe0b3; }
  .badge.wait { background:rgba(201,147,43,.18); color:#e6c07b; }
  .cat { font-weight:600; }
  .foot { margin-top:12px; color:var(--muted); font-size:12px; }
</style>
</head>
<body>
  <div class="col">
    <header>
      <b>Лид-бот</b>
      <span class="m" id="status">черновик · оператор подтверждает</span>
      <span style="flex:1"></span>
      <button class="ghost" id="reset">Новый диалог</button>
    </header>
    <div id="chat"></div>
    <form id="f">
      <input type="text" id="t" placeholder="Пишите как клиент: «Здравствуйте, не морозит холодильник…»" autocomplete="off">
      <button>Отправить</button>
    </form>
  </div>

  <aside>
    <h3>Черновик заявки</h3>
    <div id="cat" class="fld"><span class="k">Направление</span><span class="v cat">—</span></div>
    <div id="fields"></div>
    <div style="margin-top:12px" id="readybox"><span class="badge wait">собираем данные…</span></div>
    <div class="foot" id="usage"></div>
    <div class="foot">Ответ бота — это <b>черновик</b>. В боевом режиме его перед отправкой подтверждает оператор.</div>
  </aside>

<script>
const CAT = {bt:"БТ · бытовая техника", kp:"КП · компьютерная помощь", mnc:"МНЧ · муж на час", unknown:"— (уточняется)"};
const FIELDS = [["city","Город"],["phone","Телефон"],["address","Адрес"],["service","Вид работ"],["preferred_time","Время"]];
let dialogId = null;

const chat = document.getElementById('chat');
function bubble(text, cls){ const d=document.createElement('div'); d.className='msg '+cls; d.textContent=text; chat.appendChild(d); chat.scrollTop=chat.scrollHeight; return d; }

function renderState(s, missing, ready){
  document.querySelector('#cat .v').textContent = CAT[s.category]||s.category;
  const box = document.getElementById('fields'); box.innerHTML='';
  for(const [k,label] of FIELDS){
    const v = s[k]||''; const row=document.createElement('div');
    row.className='fld'+(v?'':' empty');
    row.innerHTML='<span class="k">'+label+'</span><span class="v">'+(v||'—')+'</span>';
    box.appendChild(row);
  }
  const rb=document.getElementById('readybox');
  rb.innerHTML = ready ? '<span class="badge ok">✓ данные собраны — можно оформлять</span>'
                       : '<span class="badge wait">не хватает: '+(missing.map(m=>({category:"направление",city:"город",phone:"телефон",address:"адрес",service:"вид работ",preferred_time:"время"}[m]||m)).join(', ')||'—')+'</span>';
}

async function send(text){
  bubble(text,'me');
  const wait = bubble('…','bot');
  try{
    const r = await fetch('/api/message',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({dialog_id:dialogId, text})});
    const j = await r.json();
    if(!r.ok){ wait.textContent='⚠ '+(j.error||'ошибка'); return; }
    dialogId = j.dialog_id;
    wait.textContent = j.reply;
    renderState(j.state, j.missing, j.ready);
    if(j.handoff) bubble('⚑ бот предлагает передать живому диспетчеру','sys');
    if(j.usage) document.getElementById('usage').textContent =
      'токены: '+(j.usage.input_tokens||0)+' вход / '+(j.usage.output_tokens||0)+' выход';
  }catch(e){ wait.textContent='⚠ нет связи с сервисом'; }
}

document.getElementById('f').addEventListener('submit',e=>{
  e.preventDefault(); const t=document.getElementById('t'); const v=t.value.trim();
  if(!v) return; t.value=''; send(v);
});
document.getElementById('reset').addEventListener('click',async()=>{
  if(dialogId) await fetch('/api/reset',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({dialog_id:dialogId})});
  dialogId=null; chat.innerHTML=''; renderState({category:'unknown'},['category','city','phone','address','service','preferred_time'],false);
  bubble('Новый диалог. Пишите первым сообщением клиента.','sys');
});
renderState({category:'unknown'},['category','city','phone','address','service','preferred_time'],false);
bubble('Вы играете клиента. Напишите первое сообщение — например: «Здравствуйте, сломалась стиральная машина, не сливает воду».','sys');
</script>
</body>
</html>
