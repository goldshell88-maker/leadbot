<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Оценка диалогов — Лид-бот</title>
<style>
  :root {
    --bg:#10141a; --panel:#171d26; --panel2:#1e2632; --border:#2a3442;
    --text:#dbe4ee; --muted:#8294a8; --accent:#4da3ff;
    --client:#232c3a; --bot:#17313a; --botborder:#2a5561;
    --good:#35c46f; --bad:#ff6b6b; --okc:#e8b84a;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg:#f2f5f9; --panel:#ffffff; --panel2:#eef2f7; --border:#d4dde8;
      --text:#1d2733; --muted:#5d6f83; --accent:#1a73e8;
      --client:#e9edf3; --bot:#e0f0e6; --botborder:#b5d9c2;
    }
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font:14px/1.45 -apple-system,"Segoe UI",Roboto,sans-serif; height:100vh; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:14px; padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--border); flex-wrap:wrap; }
  header h1 { font-size:16px; font-weight:600; }
  header .prog { color:var(--muted); font-size:13px; }
  header .save { margin-left:auto; color:var(--muted); font-size:12px; }
  .filters { display:flex; gap:6px; }
  .filters button { background:var(--panel2); color:var(--muted); border:1px solid var(--border); border-radius:14px; padding:3px 11px; cursor:pointer; font-size:12px; }
  .filters button.on { color:var(--text); border-color:var(--accent); }
  main { flex:1; display:flex; min-height:0; }
  #list { width:320px; min-width:250px; overflow-y:auto; background:var(--panel); border-right:1px solid var(--border); }
  .item { padding:8px 12px; border-bottom:1px solid var(--border); cursor:pointer; display:flex; gap:8px; align-items:flex-start; }
  .item:hover { background:var(--panel2); }
  .item.sel { background:var(--panel2); box-shadow:inset 3px 0 0 var(--accent); }
  .dot { width:9px; height:9px; border-radius:50%; margin-top:5px; flex:none; background:var(--border); }
  .dot.good { background:var(--good); } .dot.ok { background:var(--okc); } .dot.bad { background:var(--bad); }
  .item .t { font-size:13px; }
  .item .sub { font-size:11px; color:var(--muted); margin-top:1px; }
  #pane { flex:1; overflow-y:auto; padding:18px 22px 60px; }
  .dhead { display:flex; flex-wrap:wrap; gap:8px 14px; align-items:baseline; margin-bottom:4px; }
  .dhead h2 { font-size:17px; }
  .badge { font-size:11px; color:var(--muted); background:var(--panel2); border:1px solid var(--border); border-radius:10px; padding:1px 8px; white-space:nowrap; }
  .note { color:var(--muted); font-size:12px; margin-bottom:10px; }
  .verdict { display:flex; gap:8px; align-items:center; margin:10px 0 16px; flex-wrap:wrap; }
  .verdict button { border:1px solid var(--border); background:var(--panel2); color:var(--text); border-radius:8px; padding:5px 14px; cursor:pointer; font-size:13px; }
  .verdict button.good.on { background:var(--good); color:#08240f; border-color:var(--good); }
  .verdict button.ok.on { background:var(--okc); color:#2c2205; border-color:var(--okc); }
  .verdict button.bad.on { background:var(--bad); color:#330808; border-color:var(--bad); }
  .verdict input { flex:1; min-width:220px; background:var(--panel2); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:6px 10px; font-size:13px; }
  .msg { max-width:72%; margin-bottom:10px; }
  .msg .who { font-size:11px; color:var(--muted); margin-bottom:2px; }
  .bubble { border-radius:12px; padding:8px 12px; white-space:pre-wrap; word-break:break-word; }
  .client .bubble { background:var(--client); border:1px solid var(--border); }
  .bot { margin-left:auto; }
  .bot .bubble { background:var(--bot); border:1px solid var(--botborder); }
  .bot .bubble.empty { color:var(--muted); font-style:italic; }
  .bubble.edited { outline:2px dashed var(--okc); }
  .tools { display:flex; gap:4px; margin-top:3px; justify-content:flex-end; align-items:center; flex-wrap:wrap; }
  .client .tools { justify-content:flex-start; }
  .tools button { background:var(--panel2); border:1px solid var(--border); color:var(--muted); border-radius:7px; padding:2px 8px; cursor:pointer; font-size:12px; }
  .tools button.on.up { color:#08240f; background:var(--good); border-color:var(--good); }
  .tools button.on.down { color:#330808; background:var(--bad); border-color:var(--bad); }
  .tools .meta { font-size:10px; color:var(--muted); }
  textarea.editbox { width:100%; min-height:64px; background:var(--panel2); color:var(--text); border:1px solid var(--accent); border-radius:8px; padding:8px 10px; font:inherit; margin-top:4px; }
  .orig { font-size:11px; color:var(--muted); margin-top:3px; white-space:pre-wrap; }
  .nav { position:fixed; right:22px; bottom:16px; display:flex; gap:8px; }
  .nav button { background:var(--panel); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:7px 14px; cursor:pointer; }
  .hint { color:var(--muted); font-size:12px; padding:30px; }
</style>
</head>
<body>
<header>
  <h1>Оценка диалогов бота</h1>
  <span class="prog" id="prog"></span>
  <div class="filters" id="filters">
    <button data-f="all" class="on">Все</button>
    <button data-f="todo">Без оценки</button>
    <button data-f="good">Хорошие</button>
    <button data-f="bad">Плохие</button>
    <button data-f="edited">Правленые</button>
  </div>
  <span class="save" id="saveState">…</span>
</header>
<main>
  <div id="list"></div>
  <div id="pane"><div class="hint">Загружаю диалоги…</div></div>
</main>
<div class="nav">
  <button onclick="step(-1)">← Пред</button>
  <button onclick="step(1)">След →</button>
</div>
<script>
"use strict";
let DIALOGS = [], MARKS = {}, cur = 0, filter = "all", saveTimer = null, editingKey = null;

function mk(id) { if (!MARKS[id]) MARKS[id] = { verdict: null, comment: "", msgs: {} }; return MARKS[id]; }
function mmk(id, i) { const m = mk(id); if (!m.msgs[i]) m.msgs[i] = {}; return m.msgs[i]; }
function textOf(d, i) {
  const mm = (MARKS[d.id] && MARKS[d.id].msgs && MARKS[d.id].msgs[i]) || {};
  if (mm.edit !== undefined && mm.edit !== null) return mm.edit;
  if (mm.regen !== undefined && mm.regen !== null) return mm.regen;
  return d.messages[i].text;
}
function esc(s) { const e = document.createElement("span"); e.textContent = s == null ? "" : s; return e.innerHTML; }

function verdictOf(id) { return (MARKS[id] && MARKS[id].verdict) || null; }
function isEdited(id) {
  const m = MARKS[id]; if (!m || !m.msgs) return false;
  return Object.values(m.msgs).some(x => x && (x.edit !== undefined || x.regen !== undefined));
}
function visible() {
  return DIALOGS.filter(d => {
    if (filter === "todo") return !verdictOf(d.id);
    if (filter === "good") return verdictOf(d.id) === "good";
    if (filter === "bad") return verdictOf(d.id) === "bad";
    if (filter === "edited") return isEdited(d.id);
    return true;
  });
}

function renderList() {
  const vs = visible();
  const el = document.getElementById("list");
  el.innerHTML = vs.map(d => {
    const i = DIALOGS.indexOf(d);
    const v = verdictOf(d.id) || "";
    return '<div class="item' + (i === cur ? " sel" : "") + '" onclick="go(' + i + ')">' +
      '<span class="dot ' + v + '"></span><div><div class="t">' + esc(d.title) + '</div>' +
      '<div class="sub">' + esc((d.type || "") + " · " + (d.direction || "") + " · " + (d.city || "")) +
      (isEdited(d.id) ? " · ✏️" : "") + '</div></div></div>';
  }).join("");
  const done = DIALOGS.filter(d => verdictOf(d.id)).length;
  document.getElementById("prog").textContent = "оценено " + done + " / " + DIALOGS.length;
}

function metaBadges(m) {
  if (!m) return "";
  const parts = [];
  if (m.model) parts.push(esc(String(m.model).replace("claude-", "")));
  if (m.flag && m.flag.kind) parts.push("роутер: " + esc(m.flag.kind + (m.flag.sub ? "/" + m.flag.sub : "")));
  if (m.enforced) parts.push("озвучка: " + esc(String(m.enforced)));
  if (m.to_operator) parts.push("молча оператору");
  else if (m.handoff) parts.push("handoff");
  return parts.length ? '<span class="meta">' + parts.join(" · ") + "</span>" : "";
}

function render() {
  renderList();
  const d = DIALOGS[cur];
  const pane = document.getElementById("pane");
  if (!d) { pane.innerHTML = '<div class="hint">Нет диалогов под фильтр.</div>'; return; }
  const m = mk(d.id);
  let h = '<div class="dhead"><h2>' + esc(d.title) + "</h2>" +
    '<span class="badge">' + esc(d.type || "?") + '</span>' +
    '<span class="badge">' + esc(d.direction || "?") + '</span>' +
    '<span class="badge">' + esc(d.city || "") + '</span>' +
    '<span class="badge">аккаунт ' + esc(d.persona || "") + '</span>' +
    '<span class="badge">финал: ' + esc(d.ended_by || "") + "</span></div>";
  if (d.notes) h += '<div class="note">' + esc(d.notes) + "</div>";
  h += '<div class="verdict">' +
    '<button class="good' + (m.verdict === "good" ? " on" : "") + '" onclick="setVerdict(\'good\')">👍 Хороший</button>' +
    '<button class="ok' + (m.verdict === "ok" ? " on" : "") + '" onclick="setVerdict(\'ok\')">Так себе</button>' +
    '<button class="bad' + (m.verdict === "bad" ? " on" : "") + '" onclick="setVerdict(\'bad\')">👎 Плохой</button>' +
    '<input placeholder="комментарий к диалогу…" value="' + esc(m.comment || "").replace(/"/g, "&quot;") + '" oninput="setComment(this.value)">' +
    "</div>";
  d.messages.forEach((msg, i) => {
    const mm = (m.msgs && m.msgs[i]) || {};
    const isBot = msg.role === "bot";
    const t = textOf(d, i);
    const editedCls = (mm.edit !== undefined || mm.regen !== undefined) ? " edited" : "";
    const key = d.id + ":" + i;
    h += '<div class="msg ' + (isBot ? "bot" : "client") + '">' +
      '<div class="who">' + (isBot ? "БОТ" : "клиент") + "</div>";
    if (editingKey === key) {
      h += '<textarea class="editbox" id="editbox" onkeydown="editKey(event,' + i + ')">' + esc(t) + "</textarea>" +
        '<div class="tools"><button onclick="saveEdit(' + i + ')">Сохранить</button>' +
        '<button onclick="cancelEdit()">Отмена</button></div>';
    } else {
      h += '<div class="bubble' + (t ? "" : " empty") + editedCls + '">' + (t ? esc(t) : "(молчит — передал оператору)") + "</div>";
      if ((mm.edit !== undefined || mm.regen !== undefined) && msg.text !== t) {
        h += '<div class="orig">было: ' + esc(msg.text || "(пусто)") + "</div>";
      }
      h += '<div class="tools">';
      if (isBot) {
        h += '<button class="up' + (mm.vote === "up" ? " on up" : "") + '" onclick="vote(' + i + ',\'up\')">👍</button>' +
          '<button class="down' + (mm.vote === "down" ? " on down" : "") + '" onclick="vote(' + i + ',\'down\')">👎</button>';
      }
      h += '<button onclick="startEdit(' + i + ')">✏️ править</button>';
      if (isBot) {
        h += '<button onclick="regen(' + i + ',this)">⟳ бот заново</button>' + metaBadges(msg.meta);
      }
      h += "</div>";
    }
    h += "</div>";
  });
  pane.innerHTML = h;
}

function go(i) { cur = i; editingKey = null; render(); document.getElementById("pane").scrollTop = 0; }
function step(dir) {
  const vs = visible();
  if (!vs.length) return;
  let pos = vs.indexOf(DIALOGS[cur]);
  if (pos < 0) pos = 0; else pos = Math.min(vs.length - 1, Math.max(0, pos + dir));
  go(DIALOGS.indexOf(vs[pos]));
}
function setVerdict(v) {
  const m = mk(DIALOGS[cur].id);
  m.verdict = (m.verdict === v) ? null : v;
  save(); render();
}
function setComment(v) { mk(DIALOGS[cur].id).comment = v; save(); renderList(); }
function vote(i, v) {
  const mm = mmk(DIALOGS[cur].id, i);
  mm.vote = (mm.vote === v) ? null : v;
  save(); render();
}
function startEdit(i) { editingKey = DIALOGS[cur].id + ":" + i; render();
  const tb = document.getElementById("editbox"); if (tb) { tb.focus(); } }
function cancelEdit() { editingKey = null; render(); }
function saveEdit(i) {
  const tb = document.getElementById("editbox");
  if (tb) {
    const d = DIALOGS[cur];
    const mm = mmk(d.id, i);
    const val = tb.value;
    if (val === d.messages[i].text) { delete mm.edit; }
    else { mm.edit = val; }
    save();
  }
  editingKey = null; render();
}
function editKey(ev, i) {
  if (ev.key === "Enter" && (ev.ctrlKey || ev.metaKey)) { ev.preventDefault(); saveEdit(i); }
  if (ev.key === "Escape") { ev.preventDefault(); cancelEdit(); }
}

async function regen(i, btn) {
  const d = DIALOGS[cur];
  if (btn) { btn.disabled = true; btn.textContent = "…думает"; }
  const history = [];
  for (let k = 0; k < i; k++) {
    history.push({ role: d.messages[k].role === "bot" ? "bot" : "client", text: textOf(d, k) });
  }
  try {
    const r = await fetch("/api/message", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: history, known: { city: d.city, persona: d.persona } }) });
    const j = await r.json();
    if (j && j.reply !== undefined) {
      const mm = mmk(d.id, i);
      mm.regen = j.reply;
      delete mm.edit;
      save();
    } else { alert("Ошибка: " + (j && j.error ? j.error : r.status)); }
  } catch (e) { alert("Ошибка сети: " + e); }
  render();
}

function save() {
  clearTimeout(saveTimer);
  document.getElementById("saveState").textContent = "…";
  saveTimer = setTimeout(async () => {
    try {
      const r = await fetch("/api/review/save", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ marks: MARKS }) });
      const j = await r.json();
      document.getElementById("saveState").textContent = j.ok ? ("сохранено " + new Date().toLocaleTimeString()) : "ошибка сохранения!";
    } catch (e) {
      document.getElementById("saveState").textContent = "ошибка сети — правки НЕ сохранены";
    }
  }, 700);
}

document.getElementById("filters").addEventListener("click", ev => {
  const b = ev.target.closest("button"); if (!b) return;
  filter = b.dataset.f;
  document.querySelectorAll("#filters button").forEach(x => x.classList.toggle("on", x === b));
  renderList();
});
document.addEventListener("keydown", ev => {
  if (ev.target.tagName === "TEXTAREA" || ev.target.tagName === "INPUT") return;
  if (ev.key === "j" || ev.key === "ArrowDown") step(1);
  if (ev.key === "k" || ev.key === "ArrowUp") step(-1);
});

(async function init() {
  try {
    const r = await fetch("/api/review/data");
    const j = await r.json();
    DIALOGS = j.dialogs || [];
    MARKS = j.marks || {};
    if (!DIALOGS.length) {
      document.getElementById("pane").innerHTML =
        '<div class="hint">Диалоги ещё не сгенерированы (review_dialogs.json пуст). Запустите генерацию и обновите страницу.</div>';
      renderList(); return;
    }
    document.getElementById("saveState").textContent = "автосохранение включено";
    render();
  } catch (e) {
    document.getElementById("pane").innerHTML = '<div class="hint">Ошибка загрузки: ' + esc(String(e)) + "</div>";
  }
})();
</script>
</body>
</html>
